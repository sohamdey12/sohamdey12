<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Soham Dey Java Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b1220"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;0%;100%" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="#263244"/>

  <!-- soft moving ambient lights -->
  <circle cx="180" cy="60" r="120" fill="url(#orb)">
    <animate attributeName="cx" values="180;330;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="60;120;60" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="190" r="150" fill="url(#orb)">
    <animate attributeName="cx" values="1030;900;1030" dur="11s" repeatCount="indefinite"/>
  </circle>

  <!-- subtle animated circuit line -->
  <path d="M70 205 H270 L310 165 H430" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65">
    <animate attributeName="stroke-dasharray" values="0 500;180 320;500 0" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M770 165 H890 L930 205 H1130" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65">
    <animate attributeName="stroke-dasharray" values="0 500;180 320;500 0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </path>

  <!-- floating nodes -->
  <g fill="#60a5fa" filter="url(#glow)">
    <circle cx="310" cy="165" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="165" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" begin=".8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="104" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700"
        letter-spacing="1">SOHAM DEY</text>

  <text x="600" y="145" text-anchor="middle" fill="#cbd5e1"
        font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500"
        letter-spacing="3">JAVA FULL-STACK DEVELOPER</text>

  <rect x="465" y="175" width="270" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="180;320;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="510;440;510" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="213" text-anchor="middle" fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif" font-size="15"
        letter-spacing="1.5">JAVA • SPRING BOOT • REST APIs • REACT • SQL</text>
</svg>